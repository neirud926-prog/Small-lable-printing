<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">

  <!-- ===== Window frame (Windows 11 style) ===== -->
  <rect x="0" y="0" width="1000" height="680" fill="#F6F5F2" stroke="#C5C0B5" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="1000" height="32" fill="#FFFFFF" stroke="#DDD9D0" stroke-width="1"/>
  <circle cx="18" cy="16" r="7" fill="#FFFFFF" stroke="#DDD9D0"/>
  <text x="18" y="20" font-size="9" text-anchor="middle" fill="#5E5A50">RX</text>
  <text x="34" y="21" font-size="12" fill="#2E2B26" font-weight="600">RxStation · NLTH</text>

  <!-- Windows-style window controls on the right -->
  <g stroke="#5E5A50" stroke-width="1.4" fill="none">
    <!-- minimize -->
    <line x1="920" y1="17" x2="935" y2="17"/>
    <!-- maximize -->
    <rect x="951" y="10" width="14" height="14" rx="1"/>
    <!-- close -->
    <line x1="982" y1="10" x2="996" y2="24"/>
    <line x1="996" y1="10" x2="982" y2="24"/>
  </g>

  <!-- ===== Left rail (WHITE, 240px wide) ===== -->
  <rect x="0" y="32" width="240" height="648" fill="#FFFFFF" stroke="#DDD9D0" stroke-width="1"/>

  <!-- Rail brand -->
  <rect x="18" y="48" width="36" height="36" rx="9" fill="#FFFFFF" stroke="#EAE7E0"/>
  <text x="36" y="72" font-size="13" text-anchor="middle" fill="#5E5A50" font-weight="700">RX</text>
  <text x="64" y="65" font-size="16" font-weight="700" fill="#2E2B26">RxStation</text>
  <text x="64" y="80" font-size="12" fill="#7C7669">· NLTH</text>
  <line x1="12" y1="100" x2="228" y2="100" stroke="#EAE7E0"/>

  <!-- Drug Enquiry (always on) -->
  <g font-size="13" font-family="'Segoe UI', Arial, sans-serif">
    <rect x="10" y="112" width="220" height="34" rx="8" fill="transparent"/>
    <rect x="22" y="123" width="14" height="14" rx="2" fill="none" stroke="#7C7669"/>
    <circle cx="29" cy="130" r="3.5" fill="none" stroke="#7C7669"/>
    <text x="48" y="133" fill="#5E5A50" font-weight="500">Drug Enquiry</text>
    <rect x="188" y="122" width="32" height="15" rx="8" fill="#F2F0EB"/>
    <text x="204" y="133" font-size="9" fill="#7C7669" text-anchor="middle" font-weight="600">⌘K</text>
  </g>

  <!-- WORK section -->
  <text x="22" y="168" font-size="10" fill="#7C7669" letter-spacing="1.2" font-weight="600">WORK</text>

  <!-- Small Label Print - ACTIVE -->
  <rect x="10" y="176" width="220" height="34" rx="8" fill="#F1F5F0"/>
  <rect x="22" y="187" width="14" height="14" rx="3" fill="none" stroke="#8AA380" stroke-width="1.6"/>
  <line x1="22" y1="194" x2="36" y2="194" stroke="#8AA380" stroke-width="1.6"/>
  <text x="48" y="197" font-size="13" fill="#4E5B47" font-weight="600">Small Label Print</text>
  <rect x="188" y="186" width="32" height="15" rx="8" fill="#E2EADF"/>
  <text x="204" y="197" font-size="9" fill="#4E5B47" text-anchor="middle" font-weight="700">F1</text>

  <!-- Reconstitution -->
  <rect x="22" y="219" width="14" height="14" rx="7" fill="none" stroke="#7C7669"/>
  <text x="48" y="229" font-size="13" fill="#5E5A50" font-weight="500">Reconstitution</text>
  <rect x="188" y="218" width="32" height="15" rx="8" fill="#F2F0EB"/>
  <text x="204" y="229" font-size="9" fill="#7C7669" text-anchor="middle" font-weight="600">F2</text>

  <!-- EV54 Tools -->
  <rect x="22" y="251" width="14" height="14" rx="3" fill="none" stroke="#7C7669"/>
  <circle cx="26" cy="257" r="1" fill="#7C7669"/>
  <circle cx="32" cy="257" r="1" fill="#7C7669"/>
  <text x="48" y="261" font-size="13" fill="#5E5A50" font-weight="500">EV54 Tools</text>
  <rect x="188" y="250" width="32" height="15" rx="8" fill="#F2F0EB"/>
  <text x="204" y="261" font-size="9" fill="#7C7669" text-anchor="middle" font-weight="600">F3</text>

  <!-- DATA section -->
  <text x="22" y="296" font-size="10" fill="#7C7669" letter-spacing="1.2" font-weight="600">DATA</text>
  <path d="M 24 313 L 24 323 L 34 323 L 34 313 Z M 28 313 L 28 310 L 32 310 L 32 313" fill="none" stroke="#7C7669" stroke-width="1.4"/>
  <text x="48" y="323" font-size="13" fill="#5E5A50" font-weight="500">Maintenance</text>

  <!-- SYSTEM section -->
  <text x="22" y="358" font-size="10" fill="#7C7669" letter-spacing="1.2" font-weight="600">SYSTEM</text>
  <circle cx="29" cy="378" r="7" fill="none" stroke="#7C7669" stroke-width="1.4"/>
  <circle cx="29" cy="378" r="2" fill="none" stroke="#7C7669" stroke-width="1.4"/>
  <text x="48" y="383" font-size="13" fill="#5E5A50" font-weight="500">Settings</text>

  <!-- Rail footer -->
  <line x1="12" y1="620" x2="228" y2="620" stroke="#EAE7E0"/>
  <rect x="14" y="632" width="30" height="30" rx="8" fill="#EAE7E0"/>
  <text x="29" y="652" font-size="11" text-anchor="middle" fill="#5E5A50" font-weight="700">RX</text>
  <text x="52" y="648" font-size="12" fill="#2E2B26" font-weight="500">RxStation</text>
  <text x="52" y="662" font-size="10" fill="#7C7669">Pharmacy workstation</text>

  <!-- ===== Top bar ===== -->
  <rect x="240" y="32" width="760" height="52" fill="#FFFFFF" stroke="#DDD9D0" stroke-width="1"/>
  <text x="262" y="64" font-size="13" fill="#5E5A50" font-weight="500">Work</text>
  <text x="294" y="64" font-size="13" fill="#C5C0B5">›</text>
  <text x="306" y="64" font-size="13" fill="#2E2B26" font-weight="600">Small Label Print</text>

  <!-- Search -->
  <rect x="470" y="46" width="320" height="26" rx="8" fill="#FAF9F6" stroke="#EAE7E0"/>
  <circle cx="484" cy="59" r="5" fill="none" stroke="#7C7669"/>
  <line x1="488" y1="63" x2="492" y2="67" stroke="#7C7669"/>
  <text x="500" y="63" font-size="12" fill="#7C7669">Search drug, item code, GTIN…</text>
  <rect x="760" y="52" width="24" height="14" rx="3" fill="#FFFFFF" stroke="#DDD9D0"/>
  <text x="772" y="62" font-size="9" text-anchor="middle" fill="#7C7669" font-weight="600">⌘K</text>

  <!-- IP/OP chip -->
  <rect x="930" y="48" width="58" height="22" rx="11" fill="#F1F5F0"/>
  <circle cx="942" cy="59" r="3" fill="#3F7D5C"/>
  <text x="950" y="63" font-size="11" fill="#4E5B47" font-weight="600">IP/OP</text>

  <!-- ===== View head ===== -->
  <text x="264" y="118" font-size="24" font-weight="700" fill="#2E2B26" letter-spacing="-0.3">Small Label Print</text>
  <text x="264" y="138" font-size="13" fill="#7C7669">Scan a barcode or enter a 6-character item code.</text>

  <!-- ===== Tabs ===== -->
  <g>
    <!-- Tab group background -->
    <rect x="264" y="162" width="340" height="36" rx="10" fill="#F2F0EB"/>
    <!-- Standard Label (active) -->
    <rect x="268" y="166" width="150" height="28" rx="8" fill="#FFFFFF" stroke="#EAE7E0"/>
    <text x="343" y="185" font-size="12" fill="#2E2B26" font-weight="600" text-anchor="middle">Standard Label</text>
    <!-- Short Exp -->
    <text x="512" y="185" font-size="12" fill="#7C7669" font-weight="500" text-anchor="middle">Short Exp (After Opening)</text>
  </g>

  <!-- ===== Card ===== -->
  <rect x="264" y="220" width="700" height="380" rx="12" fill="#FFFFFF" stroke="#DDD9D0"/>

  <!-- Input label -->
  <text x="288" y="252" font-size="12" fill="#5E5A50" font-weight="600">Scan Barcode / Enter Item Code</text>

  <!-- Input box -->
  <rect x="288" y="262" width="652" height="44" rx="8" fill="#FFFFFF" stroke="#C5C0B5" stroke-width="1.5"/>
  <text x="304" y="290" font-size="13" fill="#C5C0B5">Scan or type item code, then press Enter…</text>
  <line x1="306" y1="274" x2="306" y2="296" stroke="#2E2B26" stroke-width="1.2"/>

  <!-- Helper text -->
  <text x="288" y="325" font-size="11" fill="#5E5A50">6-char code → OP label  ·  GTIN barcode → IP/OP selection  ·  13-char IP barcode → IP label</text>

  <!-- Drug loaded: preview + details -->
  <!-- Label preview (to scale: ~138 x 100 at 4mm/px roughly) -->
  <rect x="288" y="360" width="195" height="140" rx="4" fill="#FFFFFF" stroke="#DDD9D0" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="296" y="376" font-size="9" fill="#7C7669">PREVIEW  (34.4 × 25 mm)</text>
  <text x="300" y="400" font-size="11" font-weight="700" fill="#2E2B26">PARACETAMOL 500MG TAB</text>
  <text x="300" y="420" font-size="10" font-weight="700" fill="#2E2B26">Exp: 01-Jun-2028</text>
  <text x="300" y="436" font-size="10" fill="#2E2B26">Bat. No.: <tspan text-decoration="underline">260601C</tspan></text>
  <text x="300" y="462" font-size="9" fill="#5E5A50">Packed by: _____________</text>
  <text x="300" y="478" font-size="9" fill="#5E5A50">Checked by: ____________</text>

  <!-- Details panel -->
  <text x="510" y="378" font-size="15" font-weight="700" fill="#2E2B26">PARACETAMOL 500MG TAB</text>
  <text x="510" y="398" font-size="12" fill="#5E5A50">Item Code: <tspan font-weight="700" fill="#2E2B26">PARA05</tspan></text>

  <!-- IP badge -->
  <rect x="510" y="410" width="62" height="20" rx="10" fill="#E4EFE7"/>
  <text x="541" y="424" font-size="11" fill="#3F7D5C" font-weight="700" text-anchor="middle">IP Label</text>

  <!-- Expiry input (IP only) -->
  <text x="510" y="454" font-size="10" fill="#7C7669">Expiry date on label</text>
  <rect x="510" y="460" width="180" height="28" rx="6" fill="#FFFFFF" stroke="#C5C0B5" stroke-width="1.5"/>
  <text x="520" y="479" font-size="12" fill="#2E2B26">01-Jun-2028</text>

  <!-- Batch line -->
  <text x="510" y="510" font-size="12" fill="#2E2B26">Batch: <tspan font-weight="700">260601C</tspan></text>

  <!-- Print button -->
  <rect id="printbtn" x="510" y="528" width="132" height="36" rx="8" fill="#8AA380"/>
  <text x="576" y="551" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">🖨 Print Label</text>

  <!-- Clear button -->
  <rect id="clearbtn" x="650" y="528" width="80" height="36" rx="8" fill="#FFFFFF" stroke="#DDD9D0"/>
  <text x="690" y="551" font-size="13" fill="#5E5A50" font-weight="600" text-anchor="middle">Clear</text>

  <!-- ===== RED CALLOUTS ===== -->
  <g stroke="#E53935" stroke-width="2.2" fill="none">
    <rect x="264" y="162" width="162" height="36" rx="12"/>                      <!-- 1 active tab -->
    <rect x="284" y="258" width="660" height="52" rx="11"/>                      <!-- 2 scan input -->
    <rect x="506" y="524" width="140" height="44" rx="11"/>                      <!-- 3 print -->
    <rect x="646" y="524" width="88" height="44" rx="11"/>                       <!-- 4 clear -->
  </g>

  <!-- Numbered red badges -->
  <g font-weight="700" font-size="15" fill="#FFFFFF" text-anchor="middle">
    <circle cx="245" cy="180" r="14" fill="#E53935"/>
    <text x="245" y="185">1</text>
    <circle cx="245" cy="284" r="14" fill="#E53935"/>
    <text x="245" y="289">2</text>
    <circle cx="487" cy="546" r="14" fill="#E53935"/>
    <text x="487" y="551">3</text>
    <circle cx="750" cy="546" r="14" fill="#E53935"/>
    <text x="750" y="551">4</text>
  </g>

  <!-- Dashed arrow into scan box -->
  <g stroke="#E53935" stroke-width="2" fill="none" stroke-dasharray="6 4">
    <path d="M 945 336 Q 970 336 970 305 Q 970 284 945 284"/>
  </g>
  <polygon points="950,279 938,284 950,289" fill="#E53935"/>
  <text x="780" y="352" font-size="11" fill="#E53935" font-weight="700">Type or scan here</text>

</svg>
