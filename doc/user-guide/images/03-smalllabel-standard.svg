<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, Helvetica, sans-serif">
  <!-- ===== Window chrome ===== -->
  <rect x="0" y="0" width="900" height="600" fill="#ECEFF1"/>
  <rect x="0" y="0" width="900" height="32" fill="#CFD8DC"/>
  <circle cx="18" cy="16" r="6" fill="#E57373"/>
  <circle cx="38" cy="16" r="6" fill="#FFD54F"/>
  <circle cx="58" cy="16" r="6" fill="#81C784"/>
  <text x="450" y="21" font-size="12" fill="#455A64" text-anchor="middle">RxStation</text>

  <!-- ===== Left nav rail ===== -->
  <rect x="0" y="32" width="180" height="568" fill="#263238"/>
  <text x="20" y="64" font-size="13" font-weight="bold" fill="#ECEFF1">RX RxStation</text>

  <!-- nav items -->
  <g font-size="12" fill="#CFD8DC">
    <text x="20" y="100">Drug Enquiry</text>
    <!-- Small Label Print: ACTIVE -->
    <rect x="8" y="112" width="164" height="28" rx="4" fill="#37474F"/>
    <text x="20" y="130" fill="#FFFFFF" font-weight="bold">Small Label Print</text>
    <text x="148" y="130" font-size="10" fill="#90A4AE">F1</text>
    <text x="20" y="164">Reconstitution</text>
    <text x="148" y="164" font-size="10" fill="#90A4AE">F2</text>
    <text x="20" y="192">EV54 Tools</text>
    <text x="148" y="192" font-size="10" fill="#90A4AE">F3</text>
    <text x="20" y="220">Maintenance</text>
    <text x="20" y="248">Settings</text>
  </g>

  <!-- ===== Top bar (breadcrumb + search) ===== -->
  <rect x="180" y="32" width="720" height="48" fill="#FFFFFF" stroke="#CFD8DC"/>
  <text x="200" y="60" font-size="11" fill="#78909C">Work</text>
  <text x="230" y="60" font-size="11" fill="#78909C">›</text>
  <text x="242" y="60" font-size="12" fill="#263238" font-weight="bold">Small Label Print</text>
  <rect x="600" y="45" width="260" height="24" rx="4" fill="#F5F7FA" stroke="#CFD8DC"/>
  <text x="612" y="61" font-size="11" fill="#B0BEC5">Search drug, item code, GTIN…</text>
  <text x="842" y="61" font-size="10" fill="#90A4AE">⌘K</text>

  <!-- ===== Main content area ===== -->
  <rect x="180" y="80" width="720" height="520" fill="#F5F7FA"/>

  <!-- Tabs -->
  <g>
    <!-- Standard Label tab (active) -->
    <rect id="tab1" x="210" y="100" width="160" height="34" rx="4" fill="#FFFFFF" stroke="#1976D2" stroke-width="2"/>
    <text x="290" y="122" font-size="12" fill="#1976D2" font-weight="bold" text-anchor="middle">Standard Label</text>
    <!-- Short Exp tab -->
    <rect x="378" y="100" width="200" height="34" rx="4" fill="#ECEFF1" stroke="#CFD8DC"/>
    <text x="478" y="122" font-size="12" fill="#546E7A" text-anchor="middle">Short Exp (After Opening)</text>
  </g>

  <!-- Scan input -->
  <text x="210" y="165" font-size="11" fill="#455A64">Scan Barcode / Enter Item Code</text>
  <rect id="scanbox" x="210" y="175" width="500" height="40" rx="4" fill="#FFFFFF" stroke="#B0BEC5"/>
  <text x="222" y="200" font-size="12" fill="#B0BEC5">Scan or type item code, then press Enter…</text>
  <line x1="224" y1="184" x2="224" y2="208" stroke="#263238" stroke-width="1"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></line>

  <!-- Label preview card -->
  <rect x="210" y="240" width="400" height="180" rx="6" fill="#FFFFFF" stroke="#CFD8DC"/>
  <text x="225" y="262" font-size="10" fill="#78909C">Label preview</text>
  <!-- mini label -->
  <rect x="230" y="275" width="360" height="130" rx="2" fill="#FAFAFA" stroke="#CFD8DC" stroke-dasharray="3 3"/>
  <text x="240" y="298" font-size="13" font-weight="bold" fill="#263238">PARACETAMOL 500MG TAB</text>
  <text x="240" y="326" font-size="11" fill="#37474F">Exp: 01-Jun-2028</text>
  <text x="240" y="346" font-size="11" fill="#37474F">Bat. No.: 260601C</text>
  <text x="240" y="372" font-size="10" fill="#546E7A">Packed by: ____________</text>
  <text x="240" y="390" font-size="10" fill="#546E7A">Checked by: ____________</text>

  <!-- Buttons -->
  <rect id="printbtn" x="210" y="445" width="140" height="40" rx="4" fill="#1976D2"/>
  <text x="280" y="470" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">🖨 Print Label</text>

  <rect id="clearbtn" x="360" y="445" width="100" height="40" rx="4" fill="#FFFFFF" stroke="#CFD8DC"/>
  <text x="410" y="470" font-size="13" fill="#455A64" text-anchor="middle">Clear</text>

  <!-- ===== RED CALLOUTS ===== -->
  <g stroke="#E53935" stroke-width="2" fill="none">
    <!-- 1. Active tab -->
    <rect x="206" y="96" width="168" height="42" rx="6"/>
    <!-- 2. Scan input -->
    <rect x="206" y="171" width="508" height="48" rx="6"/>
    <!-- 3. Print button -->
    <rect x="206" y="441" width="148" height="48" rx="6"/>
    <!-- 4. Clear button -->
    <rect x="356" y="441" width="108" height="48" rx="6"/>
  </g>

  <!-- Numbered red badges -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="16" fill="#FFFFFF" text-anchor="middle">
    <circle cx="188" cy="117" r="14" fill="#E53935"/>
    <text x="188" y="123">1</text>
    <circle cx="735" cy="195" r="14" fill="#E53935"/>
    <text x="735" y="201">2</text>
    <circle cx="188" cy="465" r="14" fill="#E53935"/>
    <text x="188" y="471">3</text>
    <circle cx="484" cy="465" r="14" fill="#E53935"/>
    <text x="484" y="471">4</text>
  </g>

  <!-- Dashed arrow pointing at scan input -->
  <g stroke="#E53935" stroke-width="2" fill="none" stroke-dasharray="5 4">
    <path d="M 720 195 Q 700 195 670 195"/>
  </g>
  <polygon points="660,190 672,195 660,200" fill="#E53935"/>
  <text x="748" y="185" font-size="11" fill="#E53935" font-weight="bold">Type or scan here</text>

</svg>
