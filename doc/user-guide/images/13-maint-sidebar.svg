<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="660" fill="#F6F5F2"/>

  <text x="40" y="40" font-size="22" font-weight="700" fill="#2E2B26">Maintenance</text>
  <text x="40" y="60" font-size="12" fill="#7C7669">Product data, expiry rules, and batch history.</text>

  <!-- Inner sidebar -->
  <rect x="40" y="80" width="240" height="560" rx="12" fill="#FFFFFF" stroke="#DDD9D0"/>

  <text x="60" y="108" font-size="10" fill="#7C7669" font-weight="700" letter-spacing="1.2">PRODUCTS</text>
  <rect x="52" y="118" width="216" height="30" rx="8" fill="#F1F5F0"/>
  <text x="72" y="138" font-size="13" fill="#4E5B47" font-weight="700">Products</text>
  <text x="72" y="166" font-size="13" fill="#5E5A50">Expiry Rules</text>
  <text x="72" y="192" font-size="13" fill="#5E5A50">Exp After Open</text>

  <text x="60" y="228" font-size="10" fill="#7C7669" font-weight="700" letter-spacing="1.2">DATA</text>
  <text x="72" y="254" font-size="13" fill="#5E5A50">Import Excel</text>
  <text x="72" y="278" font-size="13" fill="#5E5A50">Mobile Shelf</text>
  <text x="72" y="302" font-size="13" fill="#5E5A50">EV54 Drugs</text>
  <text x="72" y="326" font-size="13" fill="#5E5A50">GTIN Database</text>

  <text x="60" y="362" font-size="10" fill="#7C7669" font-weight="700" letter-spacing="1.2">BATCHES</text>
  <text x="72" y="388" font-size="13" fill="#5E5A50">Batch History</text>
  <text x="72" y="412" font-size="13" fill="#5E5A50">Cancel Batch</text>

  <text x="60" y="448" font-size="10" fill="#7C7669" font-weight="700" letter-spacing="1.2">RULES</text>
  <text x="72" y="474" font-size="13" fill="#5E5A50">EV54 Allowlist</text>

  <!-- Main area preview -->
  <rect x="300" y="80" width="660" height="560" rx="12" fill="#FFFFFF" stroke="#DDD9D0"/>
  <text x="320" y="110" font-size="18" font-weight="700" fill="#2E2B26">Products</text>

  <!-- Type toggles -->
  <rect x="320" y="126" width="480" height="30" rx="8" fill="#F2F0EB"/>
  <rect x="322" y="128" width="96" height="26" rx="6" fill="#FFFFFF" stroke="#EAE7E0"/>
  <text x="370" y="146" font-size="11" text-anchor="middle" fill="#2E2B26" font-weight="600">Drug (PHQ)</text>
  <text x="446" y="146" font-size="11" text-anchor="middle" fill="#7C7669">ABX</text>
  <text x="504" y="146" font-size="11" text-anchor="middle" fill="#7C7669">Prepack</text>
  <text x="576" y="146" font-size="11" text-anchor="middle" fill="#7C7669">Extemp</text>
  <text x="668" y="146" font-size="11" text-anchor="middle" fill="#7C7669">Exp After Open</text>

  <!-- Search + Add -->
  <rect x="320" y="176" width="420" height="32" rx="8" fill="#FFFFFF" stroke="#C5C0B5"/>
  <text x="336" y="196" font-size="12" fill="#C5C0B5">Search…</text>
  <rect x="760" y="176" width="70" height="32" rx="8" fill="#8AA380"/>
  <text x="795" y="196" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">+ Add</text>

  <!-- Sample rows -->
  <rect x="320" y="220" width="610" height="380" rx="8" fill="#FAF9F6" stroke="#EAE7E0"/>
  <g font-size="11" font-weight="700" fill="#5E5A50">
    <text x="336" y="240">CODE</text>
    <text x="430" y="240">NAME</text>
    <text x="760" y="240">UNIT</text>
    <text x="830" y="240">ACTIONS</text>
  </g>
  <g font-size="12" fill="#2E2B26">
    <text x="336" y="270" font-weight="600">PARA05</text><text x="430" y="270">PARACETAMOL 500MG TAB</text><text x="760" y="270">TAB</text>
    <text x="838" y="270" fill="#5E5A50">✏️  🗑️</text>

    <text x="336" y="294" font-weight="600">AUGM06</text><text x="430" y="294">AUGMENTIN 625MG TAB</text><text x="760" y="294">TAB</text>
    <text x="838" y="294" fill="#5E5A50">✏️  🗑️</text>

    <text x="336" y="318" font-weight="600">AMOX03</text><text x="430" y="318">AMOXICILLIN 250MG/5ML SUSP</text><text x="760" y="318">BOT</text>
    <text x="838" y="318" fill="#5E5A50">✏️  🗑️</text>
  </g>

  <!-- Callouts -->
  <g stroke="#E53935" stroke-width="2.2" fill="none">
    <rect x="48" y="114" width="224" height="86" rx="10"/>
    <rect x="48" y="244" width="224" height="100" rx="10"/>
    <rect x="48" y="378" width="224" height="60" rx="10"/>
    <rect x="48" y="464" width="224" height="30" rx="10"/>
  </g>
  <g font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">
    <circle cx="32" cy="155" r="13" fill="#E53935"/><text x="32" y="160">1</text>
    <circle cx="32" cy="293" r="13" fill="#E53935"/><text x="32" y="298">2</text>
    <circle cx="32" cy="408" r="13" fill="#E53935"/><text x="32" y="413">3</text>
    <circle cx="32" cy="478" r="13" fill="#E53935"/><text x="32" y="483">4</text>
  </g>
</svg>
