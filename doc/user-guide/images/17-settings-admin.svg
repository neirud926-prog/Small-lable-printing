<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="580" fill="#F6F5F2"/>

  <text x="40" y="40" font-size="22" font-weight="700" fill="#2E2B26">Settings › Admin</text>
  <text x="40" y="60" font-size="12" fill="#7C7669">Hide pages and tabs you don't use. Needs the Admin PIN.</text>

  <!-- Tabs -->
  <rect x="40" y="78" width="240" height="36" rx="10" fill="#F2F0EB"/>
  <text x="99" y="100" font-size="12" fill="#7C7669" text-anchor="middle">General</text>
  <rect x="158" y="82" width="120" height="28" rx="8" fill="#FFFFFF" stroke="#EAE7E0"/>
  <text x="218" y="100" font-size="12" fill="#2E2B26" font-weight="700" text-anchor="middle">Admin</text>

  <rect x="40" y="128" width="920" height="420" rx="12" fill="#FFFFFF" stroke="#DDD9D0"/>

  <!-- PIN hint (already unlocked in this view) -->
  <rect x="60" y="148" width="880" height="40" rx="8" fill="#E1E8F0"/>
  <text x="80" y="174" font-size="12" fill="#5A7A99" font-weight="600">🔓 Admin unlocked.   Admin PIN: <tspan font-family="'Courier New', monospace" font-weight="700">nlthadmin</tspan>   (only a system admin should know this)</text>

  <!-- Main Menu Pages -->
  <text x="60" y="218" font-size="14" font-weight="700" fill="#2E2B26">📱 Main Menu Pages</text>
  <g font-size="13" fill="#2E2B26">
    <rect x="66" y="232" width="16" height="16" rx="3" fill="#8AA380"/>
    <polyline points="70,240 74,244 82,234" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="92" y="246">Small Label Print</text>

    <rect x="66" y="258" width="16" height="16" rx="3" fill="#8AA380"/>
    <polyline points="70,266 74,270 82,260" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="92" y="272">Reconstitution</text>

    <rect x="66" y="284" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#C5C0B5"/>
    <text x="92" y="298">EV54 Tools</text>
    <text x="220" y="298" font-size="11" fill="#A8443A" font-weight="600">hidden from rail</text>
  </g>

  <!-- Reconstitution Tabs -->
  <text x="60" y="348" font-size="14" font-weight="700" fill="#2E2B26">💊 Reconstitution Tabs</text>
  <g font-size="13" fill="#2E2B26">
    <rect x="66" y="362" width="16" height="16" rx="3" fill="#8AA380"/>
    <polyline points="70,370 74,374 82,364" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="92" y="376">ABX Preparation</text>

    <rect x="66" y="388" width="16" height="16" rx="3" fill="#8AA380"/>
    <polyline points="70,396 74,400 82,390" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="92" y="402">Extemporaneous</text>

    <rect x="66" y="414" width="16" height="16" rx="3" fill="#8AA380"/>
    <polyline points="70,422 74,426 82,416" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="92" y="428">Prepack</text>
  </g>

  <!-- EV54 Tools Tabs -->
  <text x="520" y="218" font-size="14" font-weight="700" fill="#2E2B26">🤖 EV54 Tools Tabs</text>
  <g font-size="13" fill="#2E2B26">
    <rect x="526" y="232" width="16" height="16" rx="3" fill="#8AA380"/>
    <polyline points="530,240 534,244 542,234" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="552" y="246">Print Pick List</text>

    <rect x="526" y="258" width="16" height="16" rx="3" fill="#8AA380"/>
    <polyline points="530,266 534,270 542,260" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="552" y="272">Print GTIN Label</text>
  </g>

  <!-- Callouts -->
  <g stroke="#E53935" stroke-width="2.2" fill="none">
    <rect x="154" y="78" width="126" height="36" rx="11"/>
    <rect x="56" y="224" width="400" height="88" rx="11"/>
    <rect x="56" y="354" width="400" height="90" rx="11"/>
    <rect x="516" y="224" width="400" height="60" rx="11"/>
  </g>
  <g font-weight="700" font-size="15" fill="#FFFFFF" text-anchor="middle">
    <circle cx="138" cy="96" r="14" fill="#E53935"/><text x="138" y="101">1</text>
    <circle cx="40" cy="268" r="14" fill="#E53935"/><text x="40" y="273">2</text>
    <circle cx="40" cy="398" r="14" fill="#E53935"/><text x="40" y="403">3</text>
    <circle cx="500" cy="254" r="14" fill="#E53935"/><text x="500" y="259">4</text>
  </g>
</svg>
