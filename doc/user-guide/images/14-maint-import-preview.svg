<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="660" fill="#F6F5F2"/>

  <text x="40" y="40" font-size="22" font-weight="700" fill="#2E2B26">Maintenance › Import Excel</text>
  <text x="40" y="60" font-size="12" fill="#7C7669">Bring a spreadsheet into the app. You can pick Merge or Replace All.</text>

  <rect x="40" y="80" width="920" height="560" rx="12" fill="#FFFFFF" stroke="#DDD9D0"/>

  <!-- Mode selector -->
  <text x="66" y="110" font-size="12" font-weight="600" fill="#5E5A50">1. Pick what you are importing</text>
  <g font-size="12">
    <rect x="66" y="122" width="110" height="34" rx="8" fill="#F1F5F0" stroke="#CBD8C5"/>
    <text x="121" y="144" fill="#4E5B47" font-weight="700" text-anchor="middle">💊 Drugs (PHQ)</text>
    <rect x="184" y="122" width="110" height="34" rx="8" fill="#FAF9F6" stroke="#EAE7E0"/>
    <text x="239" y="144" fill="#5E5A50" text-anchor="middle">📅 Expiry Rules</text>
    <rect x="302" y="122" width="70" height="34" rx="8" fill="#FAF9F6" stroke="#EAE7E0"/>
    <text x="337" y="144" fill="#5E5A50" text-anchor="middle">⚕️ ABX</text>
    <rect x="380" y="122" width="90" height="34" rx="8" fill="#FAF9F6" stroke="#EAE7E0"/>
    <text x="425" y="144" fill="#5E5A50" text-anchor="middle">📦 Prepack</text>
    <rect x="478" y="122" width="90" height="34" rx="8" fill="#FAF9F6" stroke="#EAE7E0"/>
    <text x="523" y="144" fill="#5E5A50" text-anchor="middle">⚗️ Extemp</text>
    <rect x="576" y="122" width="130" height="34" rx="8" fill="#FAF9F6" stroke="#EAE7E0"/>
    <text x="641" y="144" fill="#5E5A50" text-anchor="middle">⏰ Exp After Open</text>
    <rect x="714" y="122" width="130" height="34" rx="8" fill="#FAF9F6" stroke="#EAE7E0"/>
    <text x="779" y="144" fill="#5E5A50" text-anchor="middle">📍 Item Locations</text>
    <rect x="852" y="122" width="100" height="34" rx="8" fill="#FAF9F6" stroke="#EAE7E0"/>
    <text x="902" y="144" fill="#5E5A50" text-anchor="middle">🟢 Mobile Shelf</text>
  </g>

  <!-- File picker -->
  <text x="66" y="194" font-size="12" font-weight="600" fill="#5E5A50">2. Choose the Excel file</text>
  <rect x="66" y="206" width="868" height="66" rx="10" fill="#FAF9F6" stroke="#EAE7E0" stroke-dasharray="6 5"/>
  <text x="500" y="234" font-size="13" fill="#2E2B26" font-weight="700" text-anchor="middle">📁  Drugs PHQ 2026-04.xlsx</text>
  <text x="500" y="254" font-size="11" fill="#7C7669" text-anchor="middle">14,004 rows detected  ·  click to change</text>

  <!-- Preview table -->
  <text x="66" y="304" font-size="12" font-weight="600" fill="#5E5A50">3. Check the first few rows</text>
  <rect x="66" y="314" width="868" height="210" rx="8" fill="#FFFFFF" stroke="#EAE7E0"/>
  <rect x="66" y="314" width="868" height="32" rx="8" fill="#F2F0EB"/>
  <g font-size="11" font-weight="700" fill="#5E5A50">
    <text x="82" y="334">ITEMCODE</text>
    <text x="220" y="334">NAME</text>
    <text x="620" y="334">UNIT</text>
    <text x="720" y="334">ISSPECIAL</text>
  </g>
  <g font-size="12" fill="#2E2B26">
    <text x="82" y="368" font-weight="600">PARA05</text><text x="220" y="368">PARACETAMOL 500MG TAB</text><text x="620" y="368">TAB</text><text x="720" y="368">false</text>
    <text x="82" y="392" font-weight="600">AUGM06</text><text x="220" y="392">AUGMENTIN 625MG TAB</text><text x="620" y="392">TAB</text><text x="720" y="392">false</text>
    <text x="82" y="416" font-weight="600">AMOX03</text><text x="220" y="416">AMOXICILLIN 250MG/5ML SUSP</text><text x="620" y="416">BOT</text><text x="720" y="416">false</text>
    <text x="82" y="440" font-weight="600">PHEN18</text><text x="220" y="440">PHENYTOIN 100MG CAP</text><text x="620" y="440">CAP</text><text x="720" y="440">false</text>
    <text x="82" y="464" font-weight="600">INSL12</text><text x="220" y="464">INSULIN NOVOMIX 30 100IU/ML</text><text x="620" y="464">VIAL</text><text x="720" y="464">true</text>
  </g>
  <text x="82" y="498" font-size="11" fill="#7C7669" font-style="italic">… and 13,999 more records</text>

  <!-- Buttons -->
  <rect x="66" y="554" width="100" height="40" rx="8" fill="#FFFFFF" stroke="#DDD9D0"/>
  <text x="116" y="580" font-size="13" fill="#5E5A50" font-weight="600" text-anchor="middle">← Back</text>

  <rect x="560" y="554" width="200" height="40" rx="8" fill="#3F7D5C"/>
  <text x="660" y="580" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">✓ Merge with Existing</text>

  <rect x="774" y="554" width="160" height="40" rx="8" fill="#A8443A"/>
  <text x="854" y="580" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">⚠️ Replace All</text>

  <!-- Callouts -->
  <g stroke="#E53935" stroke-width="2.2" fill="none">
    <rect x="62" y="118" width="118" height="42" rx="11"/>
    <rect x="62" y="202" width="876" height="74" rx="12"/>
    <rect x="556" y="550" width="208" height="48" rx="11"/>
    <rect x="770" y="550" width="168" height="48" rx="11"/>
  </g>
  <g font-weight="700" font-size="15" fill="#FFFFFF" text-anchor="middle">
    <circle cx="46" cy="140" r="14" fill="#E53935"/><text x="46" y="145">1</text>
    <circle cx="46" cy="239" r="14" fill="#E53935"/><text x="46" y="244">2</text>
    <circle cx="540" cy="574" r="14" fill="#E53935"/><text x="540" y="579">3</text>
    <circle cx="754" cy="574" r="14" fill="#E53935"/><text x="754" y="579">4</text>
  </g>
</svg>
