<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="680" fill="#F6F5F2" stroke="#C5C0B5"/>
  <rect x="0" y="0" width="1000" height="32" fill="#FFFFFF" stroke="#DDD9D0"/>
  <circle cx="18" cy="16" r="7" fill="#FFFFFF" stroke="#DDD9D0"/>
  <text x="18" y="20" font-size="9" text-anchor="middle" fill="#5E5A50">RX</text>
  <text x="34" y="21" font-size="12" fill="#2E2B26" font-weight="600">RxStation · NLTH</text>
  <g stroke="#5E5A50" stroke-width="1.4" fill="none">
    <line x1="920" y1="17" x2="935" y2="17"/>
    <rect x="951" y="10" width="14" height="14" rx="1"/>
    <line x1="982" y1="10" x2="996" y2="24"/>
    <line x1="996" y1="10" x2="982" y2="24"/>
  </g>

  <!-- Rail -->
  <rect x="0" y="32" width="240" height="648" fill="#FFFFFF" stroke="#DDD9D0"/>
  <rect x="18" y="48" width="36" height="36" rx="9" fill="#FFFFFF" stroke="#EAE7E0"/>
  <text x="36" y="72" font-size="13" text-anchor="middle" fill="#5E5A50" font-weight="700">RX</text>
  <text x="64" y="65" font-size="16" font-weight="700" fill="#2E2B26">RxStation</text>
  <text x="64" y="80" font-size="12" fill="#7C7669">· NLTH</text>
  <line x1="12" y1="100" x2="228" y2="100" stroke="#EAE7E0"/>

  <!-- Drug Enquiry -->
  <rect x="10" y="112" width="220" height="34" rx="8" fill="transparent"/>
  <text x="48" y="133" font-size="13" fill="#5E5A50" font-weight="500">Drug Enquiry</text>
  <rect x="188" y="122" width="32" height="15" rx="8" fill="#F2F0EB"/>
  <text x="204" y="133" font-size="9" fill="#7C7669" text-anchor="middle" font-weight="600">⌘K</text>

  <text x="22" y="168" font-size="10" fill="#7C7669" letter-spacing="1.2" font-weight="600">WORK</text>

  <text x="48" y="197" font-size="13" fill="#5E5A50" font-weight="500">Small Label Print</text>
  <rect x="188" y="186" width="32" height="15" rx="8" fill="#F2F0EB"/>
  <text x="204" y="197" font-size="9" fill="#7C7669" text-anchor="middle" font-weight="600">F1</text>

  <text x="48" y="229" font-size="13" fill="#5E5A50" font-weight="500">Reconstitution</text>
  <rect x="188" y="218" width="32" height="15" rx="8" fill="#F2F0EB"/>
  <text x="204" y="229" font-size="9" fill="#7C7669" text-anchor="middle" font-weight="600">F2</text>

  <text x="48" y="261" font-size="13" fill="#5E5A50" font-weight="500">EV54 Tools</text>
  <rect x="188" y="250" width="32" height="15" rx="8" fill="#F2F0EB"/>
  <text x="204" y="261" font-size="9" fill="#7C7669" text-anchor="middle" font-weight="600">F3</text>

  <text x="22" y="296" font-size="10" fill="#7C7669" letter-spacing="1.2" font-weight="600">DATA</text>
  <text x="48" y="323" font-size="13" fill="#5E5A50" font-weight="500">Maintenance</text>

  <text x="22" y="358" font-size="10" fill="#7C7669" letter-spacing="1.2" font-weight="600">SYSTEM</text>
  <text x="48" y="383" font-size="13" fill="#5E5A50" font-weight="500">Settings</text>

  <!-- Rail footer -->
  <line x1="12" y1="620" x2="228" y2="620" stroke="#EAE7E0"/>
  <rect x="14" y="632" width="30" height="30" rx="8" fill="#EAE7E0"/>
  <text x="29" y="652" font-size="11" text-anchor="middle" fill="#5E5A50" font-weight="700">RX</text>
  <text x="52" y="648" font-size="12" fill="#2E2B26" font-weight="500">RxStation</text>
  <text x="52" y="662" font-size="10" fill="#7C7669">Pharmacy workstation</text>

  <!-- Top bar -->
  <rect x="240" y="32" width="760" height="52" fill="#FFFFFF" stroke="#DDD9D0"/>
  <text x="262" y="64" font-size="13" fill="#5E5A50" font-weight="500">Lookup</text>
  <text x="306" y="64" font-size="13" fill="#C5C0B5">›</text>
  <text x="318" y="64" font-size="13" fill="#2E2B26" font-weight="600">Drug Enquiry</text>
  <rect x="470" y="46" width="320" height="26" rx="8" fill="#FAF9F6" stroke="#EAE7E0"/>
  <text x="500" y="63" font-size="12" fill="#7C7669">Search drug, item code, GTIN…</text>
  <rect x="930" y="48" width="58" height="22" rx="11" fill="#F1F5F0"/>
  <circle cx="942" cy="59" r="3" fill="#3F7D5C"/>
  <text x="950" y="63" font-size="11" fill="#4E5B47" font-weight="600">IP/OP</text>

  <!-- Welcome card in the middle -->
  <rect x="300" y="140" width="640" height="420" rx="14" fill="#FFFFFF" stroke="#EAE7E0"/>
  <text x="620" y="180" font-size="22" font-weight="700" fill="#2E2B26" text-anchor="middle">Welcome to RxStation</text>
  <text x="620" y="206" font-size="13" fill="#7C7669" text-anchor="middle">Six buttons on the left rail do everything. Pick one to begin.</text>

  <!-- Six call-out tiles -->
  <g font-size="12" fill="#2E2B26">
    <rect x="340" y="240" width="260" height="70" rx="10" fill="#FAF9F6" stroke="#EAE7E0"/>
    <text x="356" y="266" font-weight="700">Drug Enquiry</text>
    <text x="356" y="286" font-size="11" fill="#5E5A50">Look up a drug by code, name, or GTIN.</text>
    <text x="356" y="302" font-size="11" fill="#5E5A50">Read-only.</text>

    <rect x="640" y="240" width="260" height="70" rx="10" fill="#F1F5F0" stroke="#CBD8C5"/>
    <text x="656" y="266" font-weight="700">Small Label Print</text>
    <text x="656" y="286" font-size="11" fill="#5E5A50">Print the sticker for a drug box.</text>
    <text x="656" y="302" font-size="11" fill="#5E5A50">Scan the barcode and go.  F1</text>

    <rect x="340" y="322" width="260" height="70" rx="10" fill="#FAF9F6" stroke="#EAE7E0"/>
    <text x="356" y="348" font-weight="700">Reconstitution</text>
    <text x="356" y="368" font-size="11" fill="#5E5A50">Labels for mixed drugs: ABX, Extemp,</text>
    <text x="356" y="384" font-size="11" fill="#5E5A50">Prepack.  F2</text>

    <rect x="640" y="322" width="260" height="70" rx="10" fill="#FAF9F6" stroke="#EAE7E0"/>
    <text x="656" y="348" font-weight="700">EV54 Tools</text>
    <text x="656" y="368" font-size="11" fill="#5E5A50">Make a pick-list for the dispensing</text>
    <text x="656" y="384" font-size="11" fill="#5E5A50">robot; print a GTIN label.  F3</text>

    <rect x="340" y="404" width="260" height="70" rx="10" fill="#FAF9F6" stroke="#EAE7E0"/>
    <text x="356" y="430" font-weight="700">Maintenance</text>
    <text x="356" y="450" font-size="11" fill="#5E5A50">Drug list, batches, expiry rules.</text>
    <text x="356" y="466" font-size="11" fill="#5E5A50">Needs a PIN.</text>

    <rect x="640" y="404" width="260" height="70" rx="10" fill="#FAF9F6" stroke="#EAE7E0"/>
    <text x="656" y="430" font-weight="700">Settings</text>
    <text x="656" y="450" font-size="11" fill="#5E5A50">Printer, fonts, data sources, PIN.</text>
    <text x="656" y="466" font-size="11" fill="#5E5A50">Needs a PIN too.</text>
  </g>

  <!-- Red callouts on the rail items -->
  <g stroke="#E53935" stroke-width="2.2" fill="none">
    <rect x="10" y="110" width="220" height="38" rx="10"/>
    <rect x="10" y="176" width="220" height="38" rx="10"/>
    <rect x="10" y="208" width="220" height="38" rx="10"/>
    <rect x="10" y="240" width="220" height="38" rx="10"/>
    <rect x="10" y="304" width="220" height="38" rx="10"/>
    <rect x="10" y="366" width="220" height="38" rx="10"/>
  </g>
  <g font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">
    <circle cx="248" cy="129" r="13" fill="#E53935"/><text x="248" y="134">1</text>
    <circle cx="248" cy="195" r="13" fill="#E53935"/><text x="248" y="200">2</text>
    <circle cx="248" cy="227" r="13" fill="#E53935"/><text x="248" y="232">3</text>
    <circle cx="248" cy="259" r="13" fill="#E53935"/><text x="248" y="264">4</text>
    <circle cx="248" cy="323" r="13" fill="#E53935"/><text x="248" y="328">5</text>
    <circle cx="248" cy="385" r="13" fill="#E53935"/><text x="248" y="390">6</text>
  </g>
</svg>
