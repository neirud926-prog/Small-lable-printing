<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="540" fill="#F6F5F2"/>

  <!-- View head -->
  <text x="40" y="46" font-size="22" font-weight="700" fill="#2E2B26">Small Label Print</text>
  <text x="40" y="66" font-size="12" fill="#7C7669">Scan a barcode or enter a 6-character item code.</text>

  <!-- Tabs -->
  <rect x="40" y="82" width="340" height="36" rx="10" fill="#F2F0EB"/>
  <text x="114" y="104" font-size="12" fill="#7C7669" font-weight="500" text-anchor="middle">Standard Label</text>
  <!-- active Short Exp -->
  <rect x="192" y="86" width="184" height="28" rx="8" fill="#FFFFFF" stroke="#EAE7E0"/>
  <text x="284" y="104" font-size="12" fill="#2E2B26" font-weight="600" text-anchor="middle">Short Exp (After Opening)</text>

  <!-- Card -->
  <rect x="40" y="138" width="920" height="370" rx="12" fill="#FFFFFF" stroke="#DDD9D0"/>

  <!-- Info banner -->
  <rect x="64" y="158" width="872" height="40" rx="8" fill="#FEF9C3" stroke="#FDE68A"/>
  <text x="78" y="184" font-size="12" fill="#2E2B26">ℹ For drugs opened from a vial/bottle — expiry is calculated from today based on pre-set rules.</text>

  <!-- Input label -->
  <text x="64" y="230" font-size="12" fill="#5E5A50" font-weight="600">Item Code or Scan</text>
  <rect x="64" y="240" width="872" height="42" rx="8" fill="#FFFFFF" stroke="#C5C0B5" stroke-width="1.5"/>
  <text x="80" y="267" font-size="13" fill="#2E2B26" font-weight="600">AMOX03</text>
  <line x1="148" y1="252" x2="148" y2="274" stroke="#2E2B26" stroke-width="1.2"/>

  <!-- Lookup button -->
  <rect x="64" y="298" width="110" height="36" rx="8" fill="#8AA380"/>
  <text x="119" y="321" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">Lookup</text>

  <!-- Result preview -->
  <rect x="64" y="354" width="200" height="130" rx="4" fill="#FFFFFF" stroke="#DDD9D0" stroke-dasharray="2 2"/>
  <text x="72" y="370" font-size="9" fill="#7C7669">PREVIEW</text>
  <text x="80" y="392" font-size="11" font-weight="700" fill="#2E2B26">AMOXICILLIN 250MG</text>
  <text x="80" y="408" font-size="11" font-weight="700" fill="#2E2B26">SUSPENSION</text>
  <text x="80" y="428" font-size="10" font-weight="700" fill="#2E2B26">Exp: 05-May-2026</text>
  <text x="80" y="442" font-size="10" fill="#2E2B26">Bat. No.: 260421 01</text>
  <text x="80" y="464" font-size="9" fill="#5E5A50">Packed by: __________</text>

  <!-- Details -->
  <text x="300" y="378" font-size="15" font-weight="700" fill="#2E2B26">AMOXICILLIN 250MG/5ML SUSP</text>
  <text x="300" y="400" font-size="12" fill="#5E5A50">IP Label · After Opening</text>
  <text x="300" y="426" font-size="12" fill="#2E2B26">Use before: <tspan font-weight="700">05-May-2026</tspan></text>
  <text x="300" y="446" font-size="12" fill="#2E2B26">Batch: <tspan font-weight="700">260421 01</tspan></text>

  <rect x="300" y="460" width="130" height="36" rx="8" fill="#8AA380"/>
  <text x="365" y="483" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">🖨 Print Label</text>
  <rect x="440" y="460" width="80" height="36" rx="8" fill="#FFFFFF" stroke="#DDD9D0"/>
  <text x="480" y="483" font-size="13" fill="#5E5A50" font-weight="600" text-anchor="middle">Clear</text>

  <!-- Callouts -->
  <g stroke="#E53935" stroke-width="2.2" fill="none">
    <rect x="188" y="82" width="192" height="36" rx="12"/>
    <rect x="60" y="236" width="880" height="50" rx="10"/>
    <rect x="60" y="294" width="118" height="44" rx="10"/>
  </g>
  <g font-weight="700" font-size="15" fill="#FFFFFF" text-anchor="middle">
    <circle cx="168" cy="100" r="14" fill="#E53935"/><text x="168" y="105">1</text>
    <circle cx="42" cy="260" r="14" fill="#E53935"/><text x="42" y="265">2</text>
    <circle cx="42" cy="316" r="14" fill="#E53935"/><text x="42" y="321">3</text>
  </g>
</svg>
