<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#F6F5F2"/>

  <text x="40" y="40" font-size="22" font-weight="700" fill="#2E2B26">Settings › Label Dimensions &amp; Typography</text>
  <text x="40" y="60" font-size="12" fill="#7C7669">Changes show in the sticker preview straight away.</text>

  <rect x="40" y="80" width="920" height="520" rx="12" fill="#FFFFFF" stroke="#DDD9D0"/>

  <text x="66" y="112" font-size="15" font-weight="700" fill="#2E2B26">🏷️ Label Dimensions &amp; Typography</text>

  <!-- Size row -->
  <text x="66" y="152" font-size="12" fill="#5E5A50" font-weight="600">Label Width (mm)</text>
  <rect x="66" y="160" width="120" height="34" rx="8" fill="#FFFFFF" stroke="#C5C0B5" stroke-width="1.5"/>
  <text x="80" y="182" font-size="14" font-weight="700" fill="#2E2B26">34.4</text>

  <text x="206" y="152" font-size="12" fill="#5E5A50" font-weight="600">Label Height (mm)</text>
  <rect x="206" y="160" width="120" height="34" rx="8" fill="#FFFFFF" stroke="#C5C0B5" stroke-width="1.5"/>
  <text x="220" y="182" font-size="14" font-weight="700" fill="#2E2B26">25</text>

  <text x="346" y="152" font-size="12" fill="#5E5A50" font-weight="600">Font Family</text>
  <rect x="346" y="160" width="200" height="34" rx="8" fill="#FFFFFF" stroke="#C5C0B5" stroke-width="1.5"/>
  <text x="360" y="182" font-size="14" fill="#2E2B26">Arial</text>
  <text x="530" y="182" font-size="12" fill="#7C7669">▾</text>

  <!-- Padding row -->
  <text x="66" y="234" font-size="13" fill="#5E5A50" font-weight="700">Padding (mm)</text>

  <text x="66" y="258" font-size="11" fill="#5E5A50">Top</text>
  <rect x="66" y="264" width="80" height="30" rx="6" fill="#FFFFFF" stroke="#C5C0B5"/>
  <text x="80" y="284" font-size="13" fill="#2E2B26">0</text>

  <text x="166" y="258" font-size="11" fill="#5E5A50">Bottom</text>
  <rect x="166" y="264" width="80" height="30" rx="6" fill="#FFFFFF" stroke="#C5C0B5"/>
  <text x="180" y="284" font-size="13" fill="#2E2B26">0</text>

  <text x="266" y="258" font-size="11" fill="#5E5A50">Left</text>
  <rect x="266" y="264" width="80" height="30" rx="6" fill="#FFFFFF" stroke="#C5C0B5"/>
  <text x="280" y="284" font-size="13" fill="#2E2B26">0</text>

  <text x="366" y="258" font-size="11" fill="#5E5A50">Right</text>
  <rect x="366" y="264" width="80" height="30" rx="6" fill="#FFFFFF" stroke="#C5C0B5"/>
  <text x="380" y="284" font-size="13" fill="#2E2B26">0</text>

  <!-- Font sizes -->
  <text x="66" y="334" font-size="13" fill="#5E5A50" font-weight="700">Font sizes (pt)</text>

  <text x="66" y="358" font-size="11" fill="#5E5A50">Drug Name</text>
  <rect x="66" y="364" width="90" height="30" rx="6" fill="#FFFFFF" stroke="#C5C0B5"/>
  <text x="80" y="384" font-size="13" fill="#2E2B26">6</text>

  <text x="176" y="358" font-size="11" fill="#5E5A50">Batch No.</text>
  <rect x="176" y="364" width="90" height="30" rx="6" fill="#FFFFFF" stroke="#C5C0B5"/>
  <text x="190" y="384" font-size="13" fill="#2E2B26">5</text>

  <text x="286" y="358" font-size="11" fill="#5E5A50">Signature</text>
  <rect x="286" y="364" width="90" height="30" rx="6" fill="#FFFFFF" stroke="#C5C0B5"/>
  <text x="300" y="384" font-size="13" fill="#2E2B26">5</text>

  <rect x="396" y="370" width="16" height="16" rx="3" fill="#8AA380"/>
  <polyline points="400,378 404,382 412,372" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <text x="422" y="384" font-size="12" fill="#2E2B26" font-weight="500">Bold drug name</text>

  <!-- Save -->
  <rect x="66" y="438" width="140" height="38" rx="8" fill="#8AA380"/>
  <text x="136" y="462" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">Save settings</text>
  <text x="216" y="462" font-size="12" fill="#3F7D5C" font-weight="600">✓ Saved</text>

  <!-- Live label preview -->
  <text x="600" y="152" font-size="12" fill="#5E5A50" font-weight="600">Live Preview</text>
  <rect x="600" y="160" width="280" height="200" rx="6" fill="#FFFFFF" stroke="#5E5A50" stroke-width="1.4"/>
  <text x="614" y="188" font-size="14" font-weight="700" fill="#2E2B26">PARACETAMOL 500MG TAB</text>
  <text x="614" y="220" font-size="12" font-weight="700" fill="#2E2B26">Exp: 01-Jun-2028</text>
  <text x="614" y="242" font-size="12" fill="#2E2B26">Bat. No.: <tspan text-decoration="underline">260601C</tspan></text>
  <text x="614" y="282" font-size="10" fill="#2E2B26">Packed by: ______________</text>
  <text x="614" y="304" font-size="10" fill="#2E2B26">Checked by: ____________</text>

  <!-- Callouts -->
  <g stroke="#E53935" stroke-width="2.2" fill="none">
    <rect x="60" y="156" width="490" height="44" rx="11"/>
    <rect x="60" y="258" width="390" height="42" rx="11"/>
    <rect x="60" y="354" width="390" height="42" rx="11"/>
    <rect x="60" y="432" width="158" height="48" rx="11"/>
  </g>
  <g font-weight="700" font-size="15" fill="#FFFFFF" text-anchor="middle">
    <circle cx="44" cy="178" r="14" fill="#E53935"/><text x="44" y="183">1</text>
    <circle cx="44" cy="279" r="14" fill="#E53935"/><text x="44" y="284">2</text>
    <circle cx="44" cy="375" r="14" fill="#E53935"/><text x="44" y="380">3</text>
    <circle cx="44" cy="456" r="14" fill="#E53935"/><text x="44" y="461">4</text>
  </g>
</svg>
