<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="900" height="520" fill="#F6F5F2"/>

  <text x="40" y="40" font-size="22" font-weight="700" fill="#2E2B26">Maintenance</text>
  <text x="40" y="60" font-size="12" fill="#7C7669">Product data, expiry rules, and batch history.</text>

  <!-- Centered PIN card -->
  <rect x="260" y="136" width="380" height="280" rx="14" fill="#FFFFFF" stroke="#DDD9D0"/>
  <circle cx="450" cy="190" r="26" fill="#F2F0EB" stroke="#EAE7E0"/>
  <path d="M 438 188 L 438 182 Q 438 174 450 174 Q 462 174 462 182 L 462 188 M 434 188 L 466 188 L 466 208 L 434 208 Z" fill="none" stroke="#5E5A50" stroke-width="1.6"/>
  <text x="450" y="246" font-size="18" font-weight="700" fill="#2E2B26" text-anchor="middle">Enter Maintenance PIN</text>
  <text x="450" y="268" font-size="12" fill="#7C7669" text-anchor="middle">Default PIN on a fresh install: NLTH</text>

  <rect x="310" y="288" width="280" height="42" rx="8" fill="#FFFFFF" stroke="#C5C0B5" stroke-width="1.5"/>
  <g font-family="'Courier New', monospace" font-size="24" font-weight="700" fill="#2E2B26" text-anchor="middle">
    <text x="358" y="320">●</text>
    <text x="398" y="320">●</text>
    <text x="438" y="320">●</text>
    <text x="478" y="320">●</text>
  </g>

  <rect x="310" y="348" width="280" height="40" rx="8" fill="#8AA380"/>
  <text x="450" y="373" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">Unlock</text>

  <!-- Callouts -->
  <g stroke="#E53935" stroke-width="2.2" fill="none">
    <rect x="306" y="284" width="288" height="50" rx="11"/>
    <rect x="306" y="344" width="288" height="48" rx="11"/>
  </g>
  <g font-weight="700" font-size="15" fill="#FFFFFF" text-anchor="middle">
    <circle cx="288" cy="309" r="14" fill="#E53935"/><text x="288" y="314">1</text>
    <circle cx="288" cy="368" r="14" fill="#E53935"/><text x="288" y="373">2</text>
  </g>
</svg>
