<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#F6F5F2"/>

  <text x="40" y="40" font-size="22" font-weight="700" fill="#2E2B26">Reconstitution</text>
  <text x="40" y="60" font-size="12" fill="#7C7669">Generate and reprint labels for compounded preparations.</text>

  <rect x="40" y="76" width="430" height="36" rx="10" fill="#F2F0EB"/>
  <text x="119" y="98" font-size="12" fill="#7C7669" text-anchor="middle">ABX Preparation</text>
  <rect x="206" y="80" width="140" height="28" rx="8" fill="#FFFFFF" stroke="#EAE7E0"/>
  <text x="276" y="98" font-size="12" fill="#2E2B26" font-weight="600" text-anchor="middle">Extemporaneous</text>
  <text x="412" y="98" font-size="12" fill="#7C7669" text-anchor="middle">Prepack</text>

  <rect x="40" y="128" width="920" height="400" rx="12" fill="#FFFFFF" stroke="#DDD9D0"/>

  <text x="66" y="160" font-size="12" fill="#5E5A50" font-weight="600">Item Code</text>
  <rect x="66" y="168" width="420" height="34" rx="8" fill="#FFFFFF" stroke="#C5C0B5" stroke-width="1.5"/>
  <text x="80" y="190" font-size="13" font-weight="600" fill="#2E2B26">ORALSIMP</text>
  <text x="470" y="190" font-size="12" fill="#7C7669">▾</text>

  <text x="66" y="228" font-size="12" fill="#5E5A50" font-weight="600">Description</text>
  <rect x="66" y="236" width="420" height="34" rx="8" fill="#FAF9F6" stroke="#EAE7E0"/>
  <text x="80" y="258" font-size="13" fill="#2E2B26">SIMPLE SYRUP ORAL LIQUID</text>

  <text x="66" y="296" font-size="12" fill="#5E5A50" font-weight="600">No. of Bottles / Units</text>
  <rect x="66" y="304" width="120" height="34" rx="8" fill="#FFFFFF" stroke="#C5C0B5" stroke-width="1.5"/>
  <text x="80" y="326" font-size="13" fill="#2E2B26">3</text>

  <!-- Right side outputs -->
  <text x="540" y="160" font-size="12" fill="#5E5A50" font-weight="600">Batch No.</text>
  <rect x="540" y="170" width="340" height="44" rx="8" fill="#FAF9F6" stroke="#EAE7E0"/>
  <text x="558" y="198" font-family="'Courier New', monospace" font-size="16" font-weight="700" fill="#2E2B26">EX-260421 03</text>

  <text x="540" y="240" font-size="12" fill="#5E5A50" font-weight="600">Use Before</text>
  <rect x="540" y="250" width="340" height="44" rx="8" fill="#E4EFE7" stroke="#CBD8C5"/>
  <text x="558" y="278" font-size="14" fill="#3F7D5C" font-weight="700">21-Jul-2026 (90 days)</text>

  <text x="540" y="320" font-size="12" fill="#5E5A50" font-weight="600">Storage condition</text>
  <rect x="540" y="328" width="340" height="34" rx="8" fill="#FAF9F6" stroke="#EAE7E0"/>
  <text x="558" y="350" font-size="13" fill="#2E2B26">Store in a cool dry place, below 25°C</text>

  <rect x="540" y="384" width="340" height="44" rx="8" fill="#F6ECD3" stroke="#FDE68A"/>
  <text x="558" y="412" font-size="12" fill="#B8862E" font-weight="700">⚠ Shake well before use</text>

  <!-- Buttons -->
  <rect x="66" y="460" width="140" height="38" rx="8" fill="#8AA380"/>
  <text x="136" y="484" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">Confirm &amp; Print</text>
  <rect x="216" y="460" width="90" height="38" rx="8" fill="#FFFFFF" stroke="#DDD9D0"/>
  <text x="261" y="484" font-size="13" fill="#5E5A50" font-weight="600" text-anchor="middle">Clear</text>

  <!-- Callouts -->
  <g stroke="#E53935" stroke-width="2.2" fill="none">
    <rect x="62" y="164" width="428" height="42" rx="11"/>
    <rect x="62" y="300" width="128" height="42" rx="11"/>
    <rect x="536" y="380" width="348" height="52" rx="11"/>
  </g>
  <g font-weight="700" font-size="15" fill="#FFFFFF" text-anchor="middle">
    <circle cx="46" cy="185" r="14" fill="#E53935"/><text x="46" y="190">1</text>
    <circle cx="46" cy="321" r="14" fill="#E53935"/><text x="46" y="326">2</text>
    <circle cx="900" cy="405" r="14" fill="#E53935"/><text x="900" y="410">3</text>
  </g>
</svg>
