<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Segoe UI', Arial, sans-serif">
  <!-- background faded app -->
  <rect x="0" y="0" width="900" height="520" fill="#2E2B26" opacity="0.45"/>
  <rect x="0" y="0" width="900" height="520" fill="#F6F5F2" opacity="0.2"/>

  <!-- Modal card -->
  <rect x="250" y="140" width="400" height="240" rx="14" fill="#FFFFFF" stroke="#DDD9D0" stroke-width="1"/>
  <text x="450" y="190" font-size="20" font-weight="700" fill="#2E2B26" text-anchor="middle">Select Label Type</text>
  <text x="450" y="220" font-size="14" fill="#5E5A50" text-anchor="middle">GTIN barcode detected. Choose label type:</text>

  <!-- OP button (blue-ish info) -->
  <rect x="290" y="270" width="150" height="62" rx="10" fill="#FFFFFF" stroke="#5A7A99" stroke-width="1.5"/>
  <text x="365" y="298" font-size="15" font-weight="700" fill="#5A7A99" text-anchor="middle">Out-Patient</text>
  <text x="365" y="320" font-size="12" font-weight="600" fill="#5A7A99" text-anchor="middle">(OP)</text>

  <!-- IP button (green primary) -->
  <rect x="460" y="270" width="150" height="62" rx="10" fill="#8AA380"/>
  <text x="535" y="298" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">In-Patient</text>
  <text x="535" y="320" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">(IP)</text>

  <!-- Callouts -->
  <g stroke="#E53935" stroke-width="2.2" fill="none">
    <rect x="286" y="266" width="158" height="70" rx="12"/>
    <rect x="456" y="266" width="158" height="70" rx="12"/>
  </g>
  <g font-weight="700" font-size="16" fill="#FFFFFF" text-anchor="middle">
    <circle cx="268" cy="300" r="15" fill="#E53935"/><text x="268" y="306">1</text>
    <circle cx="632" cy="300" r="15" fill="#E53935"/><text x="632" y="306">2</text>
  </g>

  <!-- Labels under buttons -->
  <text x="365" y="372" font-size="11" fill="#2E2B26" text-anchor="middle" font-weight="600">For ward drugs handed to patients.</text>
  <text x="365" y="388" font-size="11" fill="#5E5A50" text-anchor="middle">No expiry on the sticker.</text>

  <text x="535" y="372" font-size="11" fill="#2E2B26" text-anchor="middle" font-weight="600">For in-ward stock.</text>
  <text x="535" y="388" font-size="11" fill="#5E5A50" text-anchor="middle">Expiry is shown.</text>
</svg>
