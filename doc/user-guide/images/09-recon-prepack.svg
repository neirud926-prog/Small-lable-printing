<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="580" fill="#F6F5F2"/>

  <text x="40" y="40" font-size="22" font-weight="700" fill="#2E2B26">Reconstitution</text>
  <text x="40" y="60" font-size="12" fill="#7C7669">Generate and reprint labels for compounded preparations.</text>

  <rect x="40" y="76" width="430" height="36" rx="10" fill="#F2F0EB"/>
  <text x="119" y="98" font-size="12" fill="#7C7669" text-anchor="middle">ABX Preparation</text>
  <text x="276" y="98" font-size="12" fill="#7C7669" text-anchor="middle">Extemporaneous</text>
  <rect x="358" y="80" width="100" height="28" rx="8" fill="#FFFFFF" stroke="#EAE7E0"/>
  <text x="408" y="98" font-size="12" fill="#2E2B26" font-weight="600" text-anchor="middle">Prepack</text>

  <rect x="40" y="128" width="920" height="420" rx="12" fill="#FFFFFF" stroke="#DDD9D0"/>

  <text x="66" y="160" font-size="12" fill="#5E5A50" font-weight="600">Drug Code</text>
  <rect x="66" y="168" width="260" height="34" rx="8" fill="#FFFFFF" stroke="#C5C0B5" stroke-width="1.5"/>
  <text x="80" y="190" font-size="13" font-weight="600" fill="#2E2B26">PARA05</text>

  <text x="346" y="160" font-size="12" fill="#5E5A50" font-weight="600">Description</text>
  <rect x="346" y="168" width="540" height="34" rx="8" fill="#FAF9F6" stroke="#EAE7E0"/>
  <text x="360" y="190" font-size="13" fill="#2E2B26">PARACETAMOL 500MG TAB</text>

  <text x="66" y="228" font-size="12" fill="#5E5A50" font-weight="600">Strength</text>
  <rect x="66" y="236" width="180" height="34" rx="8" fill="#FFFFFF" stroke="#C5C0B5" stroke-width="1.5"/>
  <text x="80" y="258" font-size="13" fill="#2E2B26">500</text>

  <text x="266" y="228" font-size="12" fill="#5E5A50" font-weight="600">Unit</text>
  <rect x="266" y="236" width="120" height="34" rx="8" fill="#FFFFFF" stroke="#C5C0B5" stroke-width="1.5"/>
  <text x="280" y="258" font-size="13" fill="#2E2B26">MG</text>
  <text x="370" y="258" font-size="12" fill="#7C7669">▾</text>

  <text x="66" y="296" font-size="12" fill="#5E5A50" font-weight="600">Label Count</text>
  <rect x="66" y="304" width="120" height="34" rx="8" fill="#FFFFFF" stroke="#C5C0B5" stroke-width="1.5"/>
  <text x="80" y="326" font-size="13" fill="#2E2B26">30</text>

  <text x="206" y="296" font-size="12" fill="#5E5A50" font-weight="600">Custom Expiry (optional)</text>
  <rect x="206" y="304" width="260" height="34" rx="8" fill="#FFFFFF" stroke="#C5C0B5" stroke-width="1.5"/>
  <text x="220" y="326" font-size="13" fill="#C5C0B5">leave blank to use default</text>

  <rect x="66" y="356" width="16" height="16" rx="3" fill="#8AA380"/>
  <polyline points="70,364 74,368 82,358" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <text x="92" y="370" font-size="12" fill="#2E2B26" font-weight="500">Include prefix in batch no.</text>

  <!-- Right column -->
  <text x="520" y="228" font-size="12" fill="#5E5A50" font-weight="600">Batch No.</text>
  <rect x="520" y="236" width="360" height="44" rx="8" fill="#FAF9F6" stroke="#EAE7E0"/>
  <text x="538" y="264" font-family="'Courier New', monospace" font-size="16" font-weight="700" fill="#2E2B26">PP-260421 04</text>

  <text x="520" y="300" font-size="12" fill="#5E5A50" font-weight="600">Use Before</text>
  <rect x="520" y="308" width="360" height="44" rx="8" fill="#E4EFE7" stroke="#CBD8C5"/>
  <text x="538" y="336" font-size="14" fill="#3F7D5C" font-weight="700">31-May-2026</text>

  <!-- Buttons -->
  <rect x="66" y="470" width="130" height="38" rx="8" fill="#8AA380"/>
  <text x="131" y="494" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">Confirm</text>
  <rect x="206" y="470" width="90" height="38" rx="8" fill="#FFFFFF" stroke="#DDD9D0"/>
  <text x="251" y="494" font-size="13" fill="#5E5A50" font-weight="600" text-anchor="middle">Clear</text>

  <!-- Confirmation dialog (popup) -->
  <rect x="520" y="400" width="360" height="120" rx="10" fill="#FFFFFF" stroke="#C5C0B5" stroke-width="1.4"/>
  <text x="538" y="424" font-size="13" font-weight="700" fill="#2E2B26">Confirm</text>
  <text x="538" y="446" font-size="12" fill="#5E5A50">Use Before: 31-May-2026</text>
  <text x="538" y="462" font-size="12" fill="#5E5A50">Is this correct?</text>
  <rect x="720" y="478" width="64" height="28" rx="6" fill="#8AA380"/>
  <text x="752" y="496" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">Yes</text>
  <rect x="794" y="478" width="64" height="28" rx="6" fill="#FFFFFF" stroke="#DDD9D0"/>
  <text x="826" y="496" font-size="12" fill="#5E5A50" font-weight="600" text-anchor="middle">No</text>

  <!-- Callouts -->
  <g stroke="#E53935" stroke-width="2.2" fill="none">
    <rect x="62" y="164" width="268" height="42" rx="11"/>
    <rect x="62" y="300" width="128" height="42" rx="11"/>
    <rect x="202" y="300" width="268" height="42" rx="11"/>
    <rect x="62" y="466" width="138" height="46" rx="11"/>
    <rect x="516" y="396" width="368" height="128" rx="12"/>
  </g>
  <g font-weight="700" font-size="15" fill="#FFFFFF" text-anchor="middle">
    <circle cx="46" cy="185" r="14" fill="#E53935"/><text x="46" y="190">1</text>
    <circle cx="46" cy="321" r="14" fill="#E53935"/><text x="46" y="326">2</text>
    <circle cx="185" cy="321" r="14" fill="#E53935"/><text x="185" y="326">3</text>
    <circle cx="46" cy="489" r="14" fill="#E53935"/><text x="46" y="494">4</text>
    <circle cx="500" cy="460" r="14" fill="#E53935"/><text x="500" y="465">5</text>
  </g>
</svg>
