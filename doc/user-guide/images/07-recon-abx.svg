<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="580" fill="#F6F5F2"/>

  <text x="40" y="40" font-size="22" font-weight="700" fill="#2E2B26">Reconstitution</text>
  <text x="40" y="60" font-size="12" fill="#7C7669">Generate and reprint labels for compounded preparations.</text>

  <!-- Tabs -->
  <rect x="40" y="76" width="430" height="36" rx="10" fill="#F2F0EB"/>
  <rect x="44" y="80" width="150" height="28" rx="8" fill="#FFFFFF" stroke="#EAE7E0"/>
  <text x="119" y="98" font-size="12" fill="#2E2B26" font-weight="600" text-anchor="middle">ABX Preparation</text>
  <text x="256" y="98" font-size="12" fill="#7C7669" text-anchor="middle">Extemporaneous</text>
  <text x="400" y="98" font-size="12" fill="#7C7669" text-anchor="middle">Prepack</text>

  <!-- Card -->
  <rect x="40" y="128" width="920" height="420" rx="12" fill="#FFFFFF" stroke="#DDD9D0"/>

  <!-- Left column (inputs) -->
  <text x="66" y="160" font-size="12" fill="#5E5A50" font-weight="600">Item Code</text>
  <rect x="66" y="168" width="420" height="34" rx="8" fill="#FFFFFF" stroke="#C5C0B5" stroke-width="1.5"/>
  <text x="80" y="190" font-size="13" fill="#2E2B26" font-weight="600">AUGIV</text>
  <text x="470" y="190" font-size="12" fill="#7C7669">▾</text>

  <text x="66" y="228" font-size="12" fill="#5E5A50" font-weight="600">Drug Description</text>
  <rect x="66" y="236" width="420" height="34" rx="8" fill="#FAF9F6" stroke="#EAE7E0"/>
  <text x="80" y="258" font-size="13" fill="#2E2B26">AUGMENTIN 1.2G INJ</text>

  <text x="66" y="296" font-size="12" fill="#5E5A50" font-weight="600">Manufacturer</text>
  <rect x="66" y="304" width="420" height="34" rx="8" fill="#FFFFFF" stroke="#C5C0B5" stroke-width="1.5"/>
  <text x="80" y="326" font-size="13" fill="#2E2B26">GSK</text>
  <text x="470" y="326" font-size="12" fill="#7C7669">▾</text>

  <text x="66" y="362" font-size="12" fill="#5E5A50" font-weight="600">No. of Vials / Packs</text>
  <rect x="66" y="370" width="120" height="34" rx="8" fill="#FFFFFF" stroke="#C5C0B5" stroke-width="1.5"/>
  <text x="80" y="392" font-size="13" fill="#2E2B26">2</text>

  <!-- Prefix checkbox -->
  <rect x="66" y="420" width="16" height="16" rx="3" fill="#8AA380"/>
  <polyline points="70,428 74,432 82,422" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <text x="92" y="434" font-size="12" fill="#2E2B26" font-weight="500">Include prefix in batch no.</text>

  <!-- IP/OP toggle -->
  <text x="66" y="470" font-size="12" fill="#5E5A50" font-weight="600">Label type</text>
  <rect x="66" y="478" width="160" height="34" rx="8" fill="#F2F0EB"/>
  <rect x="70" y="482" width="75" height="26" rx="6" fill="#8AA380"/>
  <text x="107" y="500" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">IP</text>
  <text x="185" y="500" font-size="12" fill="#5E5A50" font-weight="600" text-anchor="middle">OP</text>

  <!-- Right column (outputs + buttons) -->
  <text x="540" y="160" font-size="12" fill="#5E5A50" font-weight="600">Batch No.</text>
  <rect x="540" y="170" width="340" height="44" rx="8" fill="#FAF9F6" stroke="#EAE7E0"/>
  <text x="558" y="198" font-family="'Courier New', monospace" font-size="16" fill="#2E2B26" font-weight="700">GSK-260421 02</text>

  <text x="540" y="240" font-size="12" fill="#5E5A50" font-weight="600">Use Before</text>
  <rect x="540" y="250" width="340" height="44" rx="8" fill="#E4EFE7" stroke="#CBD8C5"/>
  <text x="558" y="278" font-size="14" fill="#3F7D5C" font-weight="700">04-May-2026 (14 days after opening)</text>

  <!-- Buttons -->
  <rect x="540" y="478" width="140" height="38" rx="8" fill="#8AA380"/>
  <text x="610" y="502" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">Confirm &amp; Print</text>

  <rect x="690" y="478" width="90" height="38" rx="8" fill="#FFFFFF" stroke="#DDD9D0"/>
  <text x="735" y="502" font-size="13" fill="#5E5A50" font-weight="600" text-anchor="middle">Clear</text>

  <!-- Callouts -->
  <g stroke="#E53935" stroke-width="2.2" fill="none">
    <rect x="62" y="164" width="428" height="42" rx="11"/>
    <rect x="62" y="300" width="428" height="42" rx="11"/>
    <rect x="62" y="366" width="128" height="42" rx="11"/>
    <rect x="62" y="474" width="168" height="42" rx="11"/>
    <rect x="536" y="474" width="148" height="46" rx="11"/>
  </g>
  <g font-weight="700" font-size="15" fill="#FFFFFF" text-anchor="middle">
    <circle cx="46" cy="185" r="14" fill="#E53935"/><text x="46" y="190">1</text>
    <circle cx="46" cy="321" r="14" fill="#E53935"/><text x="46" y="326">2</text>
    <circle cx="46" cy="387" r="14" fill="#E53935"/><text x="46" y="392">3</text>
    <circle cx="46" cy="495" r="14" fill="#E53935"/><text x="46" y="500">4</text>
    <circle cx="520" cy="497" r="14" fill="#E53935"/><text x="520" y="502">5</text>
  </g>
</svg>
