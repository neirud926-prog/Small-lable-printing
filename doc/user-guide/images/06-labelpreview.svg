<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="800" height="420" fill="#F6F5F2"/>

  <text x="40" y="36" font-size="16" font-weight="700" fill="#2E2B26">The printed sticker — 34.4 × 25 mm</text>
  <text x="40" y="56" font-size="12" fill="#7C7669">Drawn at about 8× real size so you can read every line.</text>

  <!-- Label shape (IP example) at 8x scale: 275 x 200 px -->
  <rect x="60" y="86" width="275" height="200" rx="4" fill="#FFFFFF" stroke="#5E5A50" stroke-width="1.4"/>
  <text x="74" y="116" font-size="16" font-weight="700" fill="#2E2B26">PARACETAMOL 500MG TAB</text>
  <text x="74" y="152" font-size="14" font-weight="700" fill="#2E2B26">Exp: 01-Jun-2028</text>
  <text x="74" y="176" font-size="14" fill="#2E2B26">Bat. No.: <tspan text-decoration="underline">260601C</tspan></text>
  <text x="74" y="214" font-size="12" fill="#2E2B26">Packed by: ________________</text>
  <text x="74" y="238" font-size="12" fill="#2E2B26">Checked by: _______________</text>
  <text x="74" y="272" font-size="10" fill="#7C7669">(IP label — expiry shown)</text>

  <!-- OP variant -->
  <rect x="440" y="86" width="275" height="200" rx="4" fill="#FFFFFF" stroke="#5E5A50" stroke-width="1.4"/>
  <text x="454" y="116" font-size="16" font-weight="700" fill="#2E2B26">AUGMENTIN 625MG TAB</text>
  <text x="454" y="152" font-size="14" fill="#2E2B26">Bat. No.: <tspan text-decoration="underline">26050312</tspan></text>
  <text x="454" y="190" font-size="12" fill="#2E2B26">Packed by: ________________</text>
  <text x="454" y="214" font-size="12" fill="#2E2B26">Checked by: _______________</text>
  <text x="454" y="260" font-size="10" fill="#7C7669">(OP label — no expiry)</text>

  <!-- Callouts on IP label -->
  <g stroke="#E53935" stroke-width="2" fill="none">
    <rect x="68" y="96" width="258" height="28" rx="4"/>
    <rect x="68" y="136" width="258" height="28" rx="4"/>
    <rect x="68" y="162" width="258" height="28" rx="4"/>
    <rect x="68" y="198" width="258" height="50" rx="4"/>
  </g>
  <g font-weight="700" font-size="13" fill="#FFFFFF" text-anchor="middle">
    <circle cx="350" cy="110" r="12" fill="#E53935"/><text x="350" y="114">1</text>
    <circle cx="350" cy="150" r="12" fill="#E53935"/><text x="350" y="154">2</text>
    <circle cx="350" cy="176" r="12" fill="#E53935"/><text x="350" y="180">3</text>
    <circle cx="350" cy="223" r="12" fill="#E53935"/><text x="350" y="227">4</text>
  </g>

  <text x="380" y="115" font-size="11" fill="#2E2B26" font-weight="600">Drug name</text>
  <text x="380" y="155" font-size="11" fill="#2E2B26" font-weight="600">Expiry (IP only)</text>
  <text x="380" y="181" font-size="11" fill="#2E2B26" font-weight="600">Batch number — underlined</text>
  <text x="380" y="228" font-size="11" fill="#2E2B26" font-weight="600">Packed by / Checked by</text>

  <text x="380" y="340" font-size="11" fill="#7C7669">Font, size, padding, and bold settings are</text>
  <text x="380" y="355" font-size="11" fill="#7C7669">all changed in Settings → Label Dimensions</text>
  <text x="380" y="370" font-size="11" fill="#7C7669">&amp; Typography (Chapter 8).</text>
</svg>
