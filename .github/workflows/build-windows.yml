name: Build Tauri Windows App

# Triggers:
#   - Push to main when source files change (auto-build)
#   - Manual trigger from GitHub Actions tab
on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'src-tauri/src/**'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/tauri.conf.json'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

# Allow the workflow to push the built artifacts back to the branch
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use the default GITHUB_TOKEN (has write permission via permissions above)
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Node.js ─────────────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      # ── Rust ────────────────────────────────────────────────────────────────
      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            src-tauri\target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build Tauri app (NSIS + MSI bundles)
        run: npx tauri build --bundles nsis,msi
        env:
          # Prevent Tauri from requiring signing keys (no updater configured)
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      # ── Collect artifacts ────────────────────────────────────────────────────
      - name: Copy installers to release/
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null

          # NSIS installer → RxStation.exe (user-facing installer)
          $nsis = Get-ChildItem -Path "src-tauri\target\release\bundle\nsis" `
                    -Filter "*.exe" -ErrorAction SilentlyContinue |
                    Select-Object -First 1
          if ($nsis) {
            Copy-Item $nsis.FullName "release\RxStation.exe" -Force
            Write-Host "Copied NSIS installer: $($nsis.Name)  ($([math]::Round($nsis.Length/1MB, 1)) MB)"
          } else {
            Write-Warning "NSIS installer not found under src-tauri\target\release\bundle\nsis\"
          }

          # Portable build — the bare release exe (frontend embedded, no
          # install needed; requires WebView2, preinstalled on Win10/11).
          $portable = "src-tauri\target\release\app.exe"
          if (Test-Path $portable) {
            Copy-Item $portable "release\RxStation-portable.exe" -Force
            Write-Host "Copied portable exe: RxStation-portable.exe"
          } else {
            Write-Warning "Portable exe not found at $portable"
          }

          # MSI installer — strip the "NLTH " productName prefix so the
          # filename matches the NSIS exe and has no space. Wipe any stale
          # MSIs first so a productName change doesn't leave old filenames
          # tracked in the repo.
          Remove-Item release\*.msi -Force -ErrorAction SilentlyContinue
          $msi = Get-ChildItem -Path "src-tauri\target\release\bundle\msi" `
                   -Filter "*.msi" -ErrorAction SilentlyContinue |
                   Select-Object -First 1
          if ($msi) {
            $cleanName = $msi.Name -replace '^NLTH ', ''
            Copy-Item $msi.FullName "release\$cleanName" -Force
            Write-Host "Copied MSI installer:  $cleanName  ($([math]::Round($msi.Length/1MB, 1)) MB)"
          } else {
            Write-Warning "MSI installer not found under src-tauri\target\release\bundle\msi\"
          }

          Write-Host "`nrelease/ directory:"
          Get-ChildItem release\ | Format-Table Name, @{N='Size (MB)';E={[math]::Round($_.Length/1MB,1)}} -AutoSize

      # ── Upload to GitHub Artifacts (always available for download) ───────────
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            release/RxStation.exe
            release/RxStation-portable.exe
            release/*.msi
          retention-days: 30

      # ── Publish a GitHub Release ─────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: RxStation v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release/RxStation-portable.exe
            release/RxStation.exe
            release/*.msi

      # ── Commit artifacts back to main ───────────────────────────────────────
      - name: Commit and push release artifacts
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add --all release\

          $staged = git diff --cached --name-only
          if (-not $staged) {
            Write-Host "Artifacts unchanged — nothing to commit."
            exit 0
          }

          Write-Host "Committing updated artifacts:`n$staged"
          git commit -m "chore: update Windows release artifacts [skip ci]"
          if ($LASTEXITCODE -ne 0) { throw "git commit failed" }

          # Retry rebase + push in case a human pushes to main during the build.
          # `--autostash` is required because Windows checkouts often leave
          # tracked text files looking dirty (CRLF normalisation), which would
          # otherwise make `pull --rebase` abort with "unstaged changes".
          $maxAttempts = 5
          for ($i = 1; $i -le $maxAttempts; $i++) {
            Write-Host "── Attempt $i — git status before rebase ──"
            git status --short
            git pull --rebase --autostash origin main
            if ($LASTEXITCODE -ne 0) {
              git rebase --abort 2>$null
              git stash pop 2>$null
              throw "git pull --rebase failed (attempt $i)"
            }
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Done — artifacts pushed to main (attempt $i)."
              exit 0
            }
            Write-Warning "Push rejected (attempt $i/$maxAttempts) — retrying after backoff."
            Start-Sleep -Seconds ([Math]::Pow(2, $i))
          }
          throw "Failed to push artifacts to main after $maxAttempts attempts."
